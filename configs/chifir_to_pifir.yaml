experiment_name: chifir_to_pifir

data:
  source_train: data/raw/CHIFIR_reports_dev.csv
  source_test: data/raw/CHIFIR_reports_test.csv
  target_train: data/raw/PIFIR_reports_dev.csv
  target_test: data/raw/PIFIR_reports_test.csv
  text_col: order_results

model:
  name: medicalai/ClinicalBERT
  max_length: 512

training:
  epochs: 15
  learning_rate: 2e-5
  batch_size: 8
  weight_decay: 0.01
  early_stopping_patience: 3

uncertainty:
  num_mc_samples: 10
  batch_size: 16

selection:
  budget: 5
  rho: 0.9
  lambda_diversity: 0.01
  num_episodes: 300
  gamma: 0.95
  batch_size: 64
  lr: 1e-4
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  replay_buffer_size: 10000
  target_update_every: 10

output_dir: outputs/chifir_to_pifir
seed: 66